# Extend compose.yaml (and the optional models-volume overlay). Only the proxy
# exposes ports. Loopback binding is the default until an operator opts in.
x-hosted-env: &hosted-env
  TABLE_REVIEW_PUBLIC_ORIGIN: https://${TABLE_REVIEW_SITE:?Set the exact hostname, with port if needed}
  TABLE_REVIEW_SECURE_COOKIES: "true"
  TABLE_REVIEW_DEPLOYMENT_MODE: hosted
services:
  api:
    ports: !reset []
    environment: *hosted-env
  worker:
    environment: *hosted-env
  initialize:
    environment: *hosted-env
  proxy:
    build: {context: .., dockerfile: infra/Dockerfile.proxy}
    image: table-review-proxy:local
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    environment:
      TABLE_REVIEW_SITE: ${TABLE_REVIEW_SITE}
      TABLE_REVIEW_HOSTNAME: ${TABLE_REVIEW_HOSTNAME:?Set the certificate hostname without a port}
      TABLE_REVIEW_TLS_MODE: ${TABLE_REVIEW_TLS_MODE:-public_tls}
    ports:
      - "${TABLE_REVIEW_BIND_IP:-127.0.0.1}:${TABLE_REVIEW_HTTPS_PORT:-443}:8443"
      - "${TABLE_REVIEW_BIND_IP:-127.0.0.1}:${TABLE_REVIEW_HTTP_PORT:-80}:8080"
    volumes: ["proxy-data:/data", "proxy-config:/config"]
    networks: [entry]
    depends_on: [api]
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped
volumes:
  proxy-data: {}
  proxy-config: {}
