[project]
name = "table-review"
version = "0.1.0"
description = "Source-backed PDF table review and reproducible spreadsheet exports"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2,<3",
  "pypdf>=6,<7",
  "pypdfium2>=4,<6",
  "pillow>=11,<13",
  "psutil>=6,<8",
  "sqlalchemy>=2,<3",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "argon2-cffi>=25,<26",
]

[project.optional-dependencies]
extraction = ["docling>=2.132,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13,<1", "reportlab>=4,<5", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/table_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["extraction: requires cached real extraction models"]

[tool.ruff]
line-length = 100
target-version = "py312"
